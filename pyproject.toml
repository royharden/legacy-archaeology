[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "legacy-archaeology"
version = "0.1.0"
description = "Evidence-bound fixed-width account migration candidates"
requires-python = ">=3.12"
dependencies = ["pydantic==2.14.1"]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.6"]
evaluator = ["cryptography==50.0.2"]

[dependency-groups]
build = ["build==1.2.2.post1", "hatchling==1.27.0"]

[project.scripts]
la = "la.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/la"]
